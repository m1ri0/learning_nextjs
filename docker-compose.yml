services:
  db:
    build:
      context: ./docker/postgres
    container_name: nextjs-db
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextjs-dashboard-postgres
    ports:
      - "5432:5432"
    volumes:
      - nextjs_db_data:/var/lib/postgresql/data
      - ./server.crt:/run/postgresql-certs/server.crt:ro
      - ./server.key:/run/postgresql-certs/server.key:ro

volumes:
  nextjs_db_data:
